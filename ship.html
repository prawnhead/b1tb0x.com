<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Celebrity Solstice</title>
<style>
  body { margin: 0; background: #fff; font: 13px -apple-system, system-ui, sans-serif; color: #666; }
  img { display: block; width: 100%; max-width: 1100px; height: auto; margin: 0 auto; }
  p { text-align: center; margin: 6px 0 12px; }
</style>
</head>
<body>
<img id="map" src="ship.png" alt="Celebrity Solstice track map">
<p id="status">Reloads every 60 s; map is re-rendered every 10 min.</p>
<script>
  // ship.png is re-rendered every 10 min by the ship CT; the query string
  // stops the browser (and Pages CDN, max-age=600) serving a stale copy.
  const img = document.getElementById("map");
  const status = document.getElementById("status");
  function reload() {
    const next = new Image();
    next.onload = () => {
      img.src = next.src;
      status.textContent = "Checked " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false })
        + " · reloads every 60 s; map is re-rendered every 10 min.";
    };
    next.src = "ship.png?t=" + Date.now();
  }
  setInterval(reload, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) reload(); });
</script>
</body>
</html>
